# Training-path smoke test for the only currently structure-valid episode.
#
# This configuration proves that LeRobot can decode the dataset, build temporal
# action chunks, run forward/backward on CUDA, and save a checkpoint. It is not
# a production policy recipe and episode 2 alone is not enough training data.

dataset:
  repo_id: local/piper_purple_bag_two_handle_lift_manual_v1
  root: /home/ubuntu22/Piper-VLA/datasets/piper_purple_bag_two_handle_lift_manual_v1
  episodes: [2]
  video_backend: torchcodec
  eval_split: 0.0

policy:
  type: act
  device: cuda
  use_amp: false
  push_to_hub: false
  # Keep the smoke test offline: do not download torchvision weights.
  pretrained_backbone_weights: null
  chunk_size: 16
  n_action_steps: 16
  dim_model: 128
  n_heads: 4
  dim_feedforward: 512
  n_encoder_layers: 2
  n_decoder_layers: 1
  n_vae_encoder_layers: 2

seed: 1000
batch_size: 2
num_workers: 0
prefetch_factor: 2
persistent_workers: false
steps: 2
log_freq: 1
save_checkpoint: true
save_freq: 2
env_eval_freq: 0
eval_steps: 0

wandb:
  enable: false
