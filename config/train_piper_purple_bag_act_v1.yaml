# Formal ACT baseline for comparison with the existing SmolVLA run.
#
# The dataset, episode-level validation split, action horizon, camera inputs,
# state/action features, and seed match the SmolVLA experiment.  ACT uses its
# standard full-size architecture and ImageNet-pretrained ResNet-18 backbone.

dataset:
  repo_id: local/piper_purple_bag_two_handle_lift_manual_v1_clean
  root: /home/ubuntu22/Piper-VLA/datasets/piper_purple_bag_two_handle_lift_manual_v1_clean
  video_backend: torchcodec
  eval_split: 0.1
  use_imagenet_stats: true

policy:
  type: act
  device: cuda
  use_amp: false
  push_to_hub: false

  # Match the 50-frame action horizon used by the SmolVLA baseline.
  chunk_size: 50
  n_action_steps: 50
  temporal_ensemble_coeff: null

  vision_backbone: resnet18
  pretrained_backbone_weights: ResNet18_Weights.IMAGENET1K_V1
  dim_model: 512
  n_heads: 8
  dim_feedforward: 3200
  n_encoder_layers: 4
  n_decoder_layers: 1
  use_vae: true
  latent_dim: 32
  n_vae_encoder_layers: 4
  kl_weight: 10.0
  dropout: 0.1

  optimizer_lr: 0.00001
  optimizer_weight_decay: 0.0001
  optimizer_lr_backbone: 0.00001

seed: 1000
batch_size: 8
num_workers: 2
prefetch_factor: 2
persistent_workers: true

steps: 100000
log_freq: 100
save_checkpoint: true
save_freq: 10000

env_eval_freq: 0
eval_steps: 10000
max_eval_samples: 1024

wandb:
  enable: false
