# First local trial for the purple shopping-bag task.
#
# Physical setup is part of the dataset contract:
# - the bag stands in its marked pose with the logo facing the front camera;
# - one 300 ml water bottle stands at the center of the bag bottom;
# - both orange-yellow handles are stapled together with no sharp end exposed;
# - the gripper contacts the soft joined section, not the metal staples.

robot:
  type: piper
  id: piper_follower
  can_interface: can0
  expected_adapter_serial: "002900225547571120343930"
  control_chain: native_master_slave
  max_state_age_s: 0.25
  state_recovery_timeout_s: 1.0
  state_retry_interval_s: 0.01
  cameras:
    front:
      type: orbbec
      serial_number: CP28563000XR
      width: 640
      height: 480
      fps: 30
      color_mode: rgb
      use_depth: false
      timeout_ms: 1000
      warmup_s: 2.0
    wrist:
      type: orbbec
      serial_number: CP28563000XP
      width: 640
      height: 480
      fps: 30
      color_mode: rgb
      use_depth: false
      timeout_ms: 1000
      warmup_s: 2.0

teleop:
  type: piper_master
  id: piper_master
  can_interface: can0
  expected_adapter_serial: "002900225547571120343930"
  control_chain: native_master_slave

dataset:
  repo_id: local/piper_purple_bag_two_handle_lift_trial_v1
  root: /home/ubuntu22/Piper-VLA/datasets/piper_purple_bag_two_handle_lift_trial_v1
  single_task: 夹住紫色手提袋顶部订合在一起的两根橙黄色提带，将袋子竖直提离桌面约10厘米，保持悬空2秒，再将袋子放回原位，松开提带并将夹爪退离。
  fps: 30
  episode_time_s: 20
  reset_time_s: 10
  num_episodes: 1
  video: true
  push_to_hub: false
  streaming_encoding: true
  # Two seconds of buffering per camera at 30 FPS. If it still fills, the
  # recorder now waits without dropping frames and rejects an incomplete episode.
  encoder_queue_maxsize: 60
  encoder_threads: 2
  rgb_encoder:
    vcodec: h264
    pix_fmt: yuv420p
    g: 30
    crf: 23
    preset: ultrafast

display_data: false
play_sounds: false
resume: false
