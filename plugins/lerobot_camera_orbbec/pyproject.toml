[build-system]
requires = ["setuptools>=71,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_camera_orbbec"
version = "0.1.0"
description = "Orbbec SDK v2 camera plugin for LeRobot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lerobot",
  "numpy",
  "pyorbbecsdk2==2.0.18",
]

[tool.setuptools.packages.find]
include = ["lerobot_camera_orbbec*"]
