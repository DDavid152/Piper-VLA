[build-system]
requires = ["setuptools>=71,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_piper"
version = "0.1.0"
description = "Read-only Piper follower plugin for LeRobot native master/slave recording"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lerobot",
  "piper-sdk==0.6.1",
]

[tool.setuptools.packages.find]
include = ["lerobot_robot_piper*"]
